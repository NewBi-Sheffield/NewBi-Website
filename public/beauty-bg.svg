<svg xmlns="http://www.w3.org/2000/svg" width="500" height="800" viewBox="0 0 500 800">
  <g fill="none" stroke="#2D1A1F" stroke-opacity="0.07" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

